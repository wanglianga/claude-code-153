spring:
  datasource:
    url: jdbc:h2:mem:renowaste;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  rabbitmq:
    host: localhost
    port: 5672
    connection-timeout: 500
    listener:
      simple:
        auto-startup: false
        missing-queues-fatal: false
        retry:
          enabled: false

app:
  overseer:
    delay-ms: 3600000
